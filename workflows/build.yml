name: Build XiaoZhi ES3C28P Firmware

on:
  workflow_dispatch:   # 手动触发
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4

    steps:
      - name: Checkout patch files
        uses: actions/checkout@v4

      - name: Clone XiaoZhi source
        run: |
          git clone --recursive https://github.com/78/xiaozhi-esp32.git src
          cd src
          git checkout main

      - name: Apply idle home screen
        run: |
          # 替换显示代码（空闲主页：大时钟+日期+天气）
          cp main/display/lcd_display.h src/main/display/lcd_display.h
          cp main/display/lcd_display.cc src/main/display/lcd_display.cc

      - name: Apply idle/chat switching
        run: |
          cd src
          # 空闲 → 显示主页
          sed -i '/case kDeviceStateIdle:/a\            display->SetIdleMode(true);' main/application.cc
          # 对话/聆听/说话 → 显示聊天界面
          sed -i '/case kDeviceStateConnecting:/a\            display->SetIdleMode(false);' main/application.cc
          sed -i '/case kDeviceStateListening:/a\            display->SetIdleMode(false);' main/application.cc
          sed -i '/case kDeviceStateSpeaking:/a\            display->SetIdleMode(false);' main/application.cc

      - name: Build firmware
        working-directory: ./src
        run: |
          idf.py set-target esp32s3
          cp sdkconfig.defaults.esp32s3 sdkconfig.defaults
          # 选 Freenove 2.8 LCD 板型（和 ES3C28P 完全一样）
          echo "CONFIG_BOARD_TYPE_Freenove_ESP32S3_DISPLAY_2_8_LCD=y" >> sdkconfig.defaults
          echo "CONFIG_BOARD_TYPE_BREAD_COMPACT_WIFI=n" >> sdkconfig.defaults
          idf.py reconfigure
          idf.py build

      - name: Generate combined firmware
        working-directory: ./src
        run: |
          python -m esptool merge_bin \
            --output xiaozhi_es3c28p_v2.0.2.bin \
            --flash_mode qio \
            --flash_size 16MB \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 build/xiaozhi.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-es3c28p-firmware
          path: |
            src/xiaozhi_es3c28p_v2.0.2.bin
            src/build/xiaozhi.bin
          compression-level: 0
